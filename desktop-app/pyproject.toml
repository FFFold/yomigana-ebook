[project]
name = "yomigana-desktop"
version = "0.1.0"
description = "Windows GUI desktop app for yomigana-ebook"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "yomigana-ebook",
    "PySide6>=6.6,<7",
]

[project.scripts]
yomigana-desktop = "yomigana_desktop.app:main"

[tool.uv.sources]
yomigana-ebook = { workspace = true }

[dependency-groups]
dev = ["pyinstaller>=6.0", "black>=23.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yomigana_desktop"]
