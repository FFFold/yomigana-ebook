[project]
name = "yomigana-ebook"
version = "0.3.0"
description = "The fastest converter to add yomigana(readings) to Japanese epub eBooks! (Using Mecab and Unidic)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Yu Chen", email = "rabbit19981023@gmail.com" }]
keywords = ["japanese", "lightnovel", "ebook", "epub", "furigana", "yomigana", "kanji", "mecab", "unidic", "nlp"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "fugashi>=1.2.1,<2.0.0",
    "unidic>=1.1.0,<2.0.0",
    "beautifulsoup4>=4.12.2,<5.0.0",
    "lxml>=4.9.2,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/FFFold/yomigana-ebook"
Repository = "https://github.com/FFFold/yomigana-ebook"

[project.scripts]
yomigana_ebook = "yomigana_ebook.cli:main"

[dependency-groups]
dev = ["black>=23.3.0"]
test = ["pytest>=7.3.1", "pytest-watcher>=0.2.6", "pytest-testmon>=2.0.6"]

[tool.uv.workspace]
members = ["web-demo", "desktop-app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
